<!doctype html>
<!-- Behind the game's frame before it runs (960x640 on the page; shot at
     1920x1280 and halved): the play screen as the frame will show it, without
     the HUD, dimmed a little so the Run button stands out. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  .canvas { width: 960px; height: 640px; background: var(--panel); }
  .dim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(13, 5, 16, 0.45), rgba(13, 5, 16, 0.2) 70%); }
</style>
</head>
<body>
<div class="canvas">
  <img class="plate" src="../build/plates/embed.png">
  <div class="dim"></div>
</div>
</body>
</html>
